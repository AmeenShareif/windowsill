name: build

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    # Built with the newest stable SDK so the app takes the current system look on macOS 26 and later;
    # an app linked against an older SDK keeps the old one there. It still runs from macOS 14 (Package.swift).
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write          # gh release create on a v* tag
    env:
      # Secrets cannot be read in `if:`; this exposes only whether the certificate is there. The secrets
      # themselves are mapped into the env of the steps that use them. See docs/DISTRIBUTION.md.
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          system_profiler SPDisplaysDataType | grep -E "Resolution|Display Type" || true

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/windowsill-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$CERT"' EXIT
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # A .p12 exported from Keychain Access holds no intermediate; add Apple's Developer ID CAs
          # (G2 for current certificates, G1 for older ones) so the chain verifies on any runner image.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" \
              || echo "could not add $ca; relying on the runner's own copy"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then
            echo "MACOS_CERT_P12 holds no valid Developer ID Application identity; what it holds:"
            security find-identity -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "signing as $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Windowsill.app (universal)
        run: bash scripts/build-app.sh dist

      - name: Self-check
        run: dist/Windowsill.app/Contents/MacOS/Windowsill --selfcheck

      - name: Scripted demos with screenshots
        run: bash scripts/demo-shots.sh dist/Windowsill.app out/shots

      - name: Package zip and dmg (notarized when credentials are set)
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: bash scripts/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Windowsill-app
          path: |
            dist/Windowsill.dmg
            dist/Windowsill.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: out/

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Windowsill.dmg dist/Windowsill.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Windowsill.dmg dist/Windowsill.zip \
              --verify-tag --title "Windowsill ${GITHUB_REF_NAME#v}" --generate-notes
          fi

      - name: Delete signing keychain
        if: always() && env.HAS_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/windowsill-signing.keychain-db" || true

  # The very app `mac` packaged, unzipped as a download would be and run through every demo on
  # macOS 27. On demand and for every release, not on each push. It runs on GitHub's `xcode-27`
  # image, still a preview that may queue or break on its own, so the release never waits on it.
  macos27:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windowsill-app
          path: shipped
      - name: Unzip the shipped app
        run: |
          sw_vers
          ditto -x -k shipped/Windowsill.zip shipped
          codesign -dv shipped/Windowsill.app 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
      - name: Self-check
        run: shipped/Windowsill.app/Contents/MacOS/Windowsill --selfcheck
      - name: Scripted demos with screenshots
        run: bash scripts/demo-shots.sh shipped/Windowsill.app out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-macos27
          path: out/
